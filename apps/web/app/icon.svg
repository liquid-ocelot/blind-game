<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>The Blind Game</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fcd34d"/>
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Visage -->
  <circle cx="256" cy="266" r="176" fill="url(#face)"/>

  <!-- Joues -->
  <circle cx="148" cy="340" r="24" fill="#fb923c" fill-opacity="0.35"/>
  <circle cx="364" cy="340" r="24" fill="#fb923c" fill-opacity="0.35"/>

  <!-- Sourire -->
  <path d="M196 352 Q256 404 316 352" fill="none" stroke="#7c2d12" stroke-width="16" stroke-linecap="round"/>

  <!-- Notes de musique qui couvrent les yeux -->
  <g fill="#1e1b4b">
    <ellipse cx="192" cy="252" rx="48" ry="37" transform="rotate(-20 192 252)"/>
    <ellipse cx="324" cy="252" rx="48" ry="37" transform="rotate(-20 324 252)"/>
    <rect x="222" y="168" width="16" height="84"/>
    <rect x="354" y="140" width="16" height="112"/>
    <path d="M222 168 L370 140 L370 184 L222 212 Z"/>
  </g>
</svg>
